[package]
name = "wuwa_connect"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
aes = "0.8"
base64 = "0.22"
cbc = "0.1"
cipher = "0.4"
hex = "0.4"
jni = "0.21"
lzma = { package = "xz2", version = "0.1", features = ["static"] }
rusqlite = { version = "0.35", features = ["bundled"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
url = "2.5"

[profile.release]
opt-level = 3
lto = true
strip = true
